name: Coverage
on:
    push: { branches: [main] }
    pull_request:
permissions:
    contents: read

jobs:
    coverage:
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        permissions:
            contents: read
            id-token: write
        env:
            RAPIRA_REQUIRE_EXTS: openssl
            RUST_BACKTRACE: "1"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with: { persist-credentials: false }
            - uses: ./.github/actions/php-async
              with: { profile: debug }
            - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
              with: { components: llvm-tools-preview }
            - uses: taiki-e/install-action@ab4220e067fa624f7930084426dbfb7440a52829 # cargo-llvm-cov
            - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
              with:
                  cache-on-failure: true
                  key: php-async-coverage-${{ hashFiles('.github/php-async.env') }}
            - run: make coverage
            - name: Upload to Codecov
              uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
              with:
                  files: lcov.info
                  use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
                  fail_ci_if_error: true
